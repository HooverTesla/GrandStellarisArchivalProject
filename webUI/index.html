<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grand Stellaris Archive</title>
  <link href="https://fonts.googleapis.com/css?family=Arimo" rel="stylesheet">
  <link rel="stylesheet" href="../stellaris-tech-tree/assets/vendor/Treant.css">
  <link rel="stylesheet" href="../stellaris-tech-tree/assets/vendor/tooltipster.bundle.min.css">
  <link rel="stylesheet" href="../stellaris-tech-tree/assets/css/tech-tree.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-topbar">
    <div class="main-header-row">
      <ul class="module-tabs">
        <li class="module-tab is-active" data-module="home">
          <button type="button" class="module-tab-button">
            <span>Home</span>
            <img src="../stellaris-tech-tree/assets/icons/homesystem.png" class="tab-icon" alt="Home">
          </button>
        </li>
        <li class="module-tab" data-module="tech">
          <button type="button" class="module-tab-button">
            <span>Tech</span>
            <img
              src="../assets/stellaris/gfx/interface/icons/situation_log/situation_log_main_quest.webp"
              class="tab-icon"
              alt="Tech"
              onerror="this.onerror=null;this.src='../stellaris-tech-tree/assets/icons/research_icon.png';"
            >
          </button>
        </li>
        <li class="module-tab" data-module="anomalies">
          <button type="button" class="module-tab-button">
            <span>Anomalies</span>
            <img src="../stellaris-tech-tree/assets/icons/event.png" class="tab-icon" alt="Anomalies">
          </button>
        </li>
        <li class="module-tab" data-module="events">
          <button type="button" class="module-tab-button">
            <span>Events</span>
            <img src="../assets/stellaris/gfx/interface/icons/message/message_event_generic.webp" class="tab-icon" alt="Events">
          </button>
        </li>
        <li class="module-tab" data-module="arc-sites">
          <button type="button" class="module-tab-button">
            <span>Archaeological Sites</span>
            <img src="../assets/stellaris/gfx/interface/archaeology/icon_archaeology.webp" class="tab-icon" alt="Archaeological Sites">
          </button>
        </li>
        <li class="module-tab" data-module="astral-rifts">
          <button type="button" class="module-tab-button">
            <span>Astral Rifts</span>
            <img src="../assets/stellaris/gfx/interface/icons/situation_log/situation_log_astral_rift.webp" class="tab-icon" alt="Astral Rifts">
          </button>
        </li>
      </ul>

      <div class="main-search">
        <input id="global-search" list="global-search-list" placeholder="Search everything">
        <datalist id="global-search-list"></datalist>
      </div>
    </div>

    <nav id="tech-subnav" class="tech-subnav is-hidden">
      <button type="button" class="tech-subtab is-active" data-tech-tab="all">
        <span>All</span>
        <img src="../stellaris-tech-tree/assets/icons/research_icon.png" alt="All">
      </button>
      <button type="button" class="tech-subtab" data-tech-tab="physics">
        <span>Physics</span>
        <img src="../stellaris-tech-tree/assets/icons/physics_research.png" alt="Physics">
      </button>
      <button type="button" class="tech-subtab" data-tech-tab="society">
        <span>Society</span>
        <img src="../stellaris-tech-tree/assets/icons/society_research.png" alt="Society">
      </button>
      <button type="button" class="tech-subtab" data-tech-tab="engineering">
        <span>Engineering</span>
        <img src="../stellaris-tech-tree/assets/icons/engineering_research.png" alt="Engineering">
      </button>
      <button type="button" class="tech-subtab" data-tech-tab="events">
        <span>Events</span>
        <img src="../stellaris-tech-tree/assets/icons/event.png" alt="Events">
      </button>
    </nav>
  </header>

  <main class="app-shell">
    <p id="manifest-meta" class="meta">Loading manifest...</p>
    <section id="status-panel" class="status-panel"></section>

    <section id="module-home" class="module-panel is-active">
      <section class="panel">
        <h2>Empire / Home</h2>
        <p>Home hub for saved items and empire setup. Search results will auto-switch to the relevant module tab.</p>

        <section class="home-controls">
          <label for="locale-select">Language</label>
          <select id="locale-select"></select>
          <label for="anomaly-select">Anomaly</label>
          <select id="anomaly-select"></select>
          <button id="load-anomaly-button" type="button">Load Chain</button>
        </section>
      </section>
    </section>

    <section id="module-tech" class="module-panel">
      <section class="panel tech-tree-panel">
        <h2>Tech Tree Module</h2>
        <input id="deepsearch" class="stt-deepsearch" aria-hidden="true" tabindex="-1">
        <div id="tech-tree">
          <div id="tech-tree-search" class="float-NoDisplay"></div>
          <div id="tech-tree-physics"></div>
          <div id="tech-tree-society"></div>
          <div id="tech-tree-engineering"></div>
          <div id="tech-tree-anomalies" class="float-NoDisplay"></div>
        </div>
        <div class="stt-research-tools">
          <button id="research_save" class="research hide" type="button">Save</button>
          <button id="research_load" class="research hide" type="button">Load</button>
          <button id="research_remove" class="research hide" type="button">Remove</button>
          <label class="research hide">
            Research List:
            <input id="research_selection" list="research_list">
            <datalist id="research_list"></datalist>
          </label>
        </div>
        <p class="meta stt-credit">
          Original STT by
          <a href="https://gitlab.com/bipedalshark/stellaris-tech-tree" target="_blank" rel="noreferrer">bipedalshark</a>,
          parser/work by
          <a href="https://github.com/BloodStainedCrow/stellaris-technology" target="_blank" rel="noreferrer">BloodStainedCrow</a>.
        </p>
      </section>
    </section>

    <section id="module-anomalies" class="module-panel">
      <section id="anomaly-panel" class="panel"></section>
    </section>

    <section id="module-events" class="module-panel">
      <section id="events-panel" class="panel"></section>
    </section>

    <section id="module-arc-sites" class="module-panel">
      <section id="arc-sites-panel" class="panel"></section>
    </section>

    <section id="module-astral-rifts" class="module-panel">
      <section class="panel">
        <h2>Astral Rifts</h2>
        <p>Astral Rift module placeholder.</p>
      </section>
    </section>
  </main>

  <script id="node-template" type="text/x-jsrender">
    <div class="icon lozad" data-background-image="../stellaris-tech-tree/assets/img/{{:key}}.png"></div>
    <p class="node-name" title="{{:name}}">{{:name}}</p>
    <p class="node-title">
    {{if tier < 1}}
      {{:category}}  - <span class="tier tier-0">Starting</span>
    {{else}}
      {{:category}} - <span class="tier tier-{{:tier}}">Tier {{:tier}}</span>
    {{/if}}
    </p>
    <p class="node-desc">
    {{if tier > 0}}
    Cost: <span class="{{:area}}-research">{{:cost}}, Weight: {{:base_weight}}</span>
    {{/if}}
    </p>
    <p class="node-desc" style="color:yellow">
    {{if is_gestalt === true}}
      <img src="../stellaris-tech-tree/assets/icons/yes.png"/><img src="../stellaris-tech-tree/assets/icons/ethic_gestalt_consciousness.png" height="21" width="21"/>
    {{/if}}
    {{if is_gestalt === false}}
      <img src="../stellaris-tech-tree/assets/icons/no.png"/><img src="../stellaris-tech-tree/assets/icons/ethic_gestalt_consciousness.png" height="21" width="21"/>
    {{/if}}
    {{if is_machine_empire === true}}
      <img src="../stellaris-tech-tree/assets/icons/yes.png"/><img src="../stellaris-tech-tree/assets/icons/auth_machine_intelligence.png" height="21" width="21"/>
    {{/if}}
    {{if is_machine_empire === false}}
      <img src="../stellaris-tech-tree/assets/icons/no.png"/><img src="../stellaris-tech-tree/assets/icons/auth_machine_intelligence.png" height="21" width="21"/>
      {{if is_drive_assimilator === true}}
      <img src="../stellaris-tech-tree/assets/icons/yes.png"/><img src="../stellaris-tech-tree/assets/icons/civic_machine_assimilator.png" height="21" width="21"/>
      {{/if}}
      {{if is_rogue_servitor === true}}
      <img src="../stellaris-tech-tree/assets/icons/yes.png"/><img src="../stellaris-tech-tree/assets/icons/civic_machine_servitor.png" height="21" width="21"/>
      {{/if}}
    {{/if}}
    {{if is_hive_empire === true}}
      <img src="../stellaris-tech-tree/assets/icons/yes.png"/><img src="../stellaris-tech-tree/assets/icons/auth_hive_mind.png" height="21" width="21"/>
    {{/if}}
    {{if is_hive_empire === false}}
      <img src="../stellaris-tech-tree/assets/icons/no.png"/><img src="../stellaris-tech-tree/assets/icons/auth_hive_mind.png" height="21" width="21"/>
    {{/if}}
    {{if is_megacorp === true}}
      <img src="../stellaris-tech-tree/assets/icons/yes.png"/><img src="../stellaris-tech-tree/assets/icons/auth_corporate.png" height="21" width="21"/>
    {{/if}}
    {{if is_megacorp === false}}
      <img src="../stellaris-tech-tree/assets/icons/no.png"/><img src="../stellaris-tech-tree/assets/icons/auth_corporate.png" height="21" width="21"/>
    {{/if}}
    </p>
    <div class="node-status"></div>
    <div class="extra-data">
    <div class="tooltip-header">Description</div>
    <div class="tooltip-content" style="max-width:320px">{{:description}}</div>
    {{if weight_modifiers.length > 0}}
        <div class="tooltip-header">Weight Modifiers</div>
        <div class="tooltip-content"><pre>{{:weight_modifiers.join('<br/>')}}</pre></div>
    {{/if}}
    {{if potential.length > 0}}
        <div class="tooltip-header">Requirements</div>
        <div class="tooltip-content"><pre>{{:potential.join('<br/>')}}</pre></div>
    {{/if}}
    {{if prerequisites.length > 1}}
        <div class="tooltip-header">Required Technologies</div>
        <div class="tooltip-content prerequisites">
        {{for prerequisites}}
            <img class="left {{:}}" height="52" width="52" src="//:0" data-src="../stellaris-tech-tree/assets/img/{{:}}.png">
        {{/for}}
        <div class="left">
        {{for prerequisites_names}}
          <span class="node-status {{:key}}">{{:name}}</span><br/>
        {{/for}}
        </div>
        </div>
    {{/if}}
    {{if feature_unlocks.length > 0}}
        <div class="tooltip-header">Research Effects</div>
        <div class="tooltip-content">{{:feature_unlocks.join('<br/>')}}</div>
    {{/if}}
    </div>
  </script>

  <script src="../stellaris-tech-tree/assets/vendor/jquery.min.js"></script>
  <script src="../stellaris-tech-tree/assets/vendor/jquery.touchy.min.js"></script>
  <script src="../stellaris-tech-tree/assets/vendor/raphael.min.js"></script>
  <script src="../stellaris-tech-tree/assets/vendor/Treant.js"></script>
  <script src="../stellaris-tech-tree/assets/vendor/tooltipster.bundle.min.js"></script>
  <script src="../stellaris-tech-tree/assets/vendor/lozad.min.js"></script>
  <script src="../stellaris-tech-tree/assets/vendor/jsrender.min.js"></script>
  <script src="../stellaris-tech-tree/assets/js/dynamic-drag.js"></script>
  <script src="../stellaris-tech-tree/assets/js/tech-tracking.js"></script>
  <script src="./stt-native.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
