name: Deploy Live

on:
  push:
    branches:
      - Live
      - live
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SG_SSH_TARGET: ${{ secrets.SG_SSH_TARGET }}
      SG_REMOTE_PATH: ${{ secrets.SG_REMOTE_PATH }}
      SG_SSH_PORT: ${{ secrets.SG_SSH_PORT }}
      SG_SSH_PRIVATE_KEY: ${{ secrets.SG_SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deploy dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Validate deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SG_SSH_TARGET:-}" ]; then
            echo "Missing secret: SG_SSH_TARGET" >&2
            exit 1
          fi
          if [ -z "${SG_REMOTE_PATH:-}" ]; then
            echo "Missing secret: SG_REMOTE_PATH" >&2
            exit 1
          fi
          if [ -z "${SG_SSH_PRIVATE_KEY:-}" ]; then
            echo "Missing secret: SG_SSH_PRIVATE_KEY" >&2
            exit 1
          fi
          if [[ "${SG_REMOTE_PATH}" != /* ]]; then
            echo "SG_REMOTE_PATH must be an absolute path, got: ${SG_REMOTE_PATH}" >&2
            exit 1
          fi
          if [[ "${SG_SSH_PRIVATE_KEY}" != *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            echo "SG_SSH_PRIVATE_KEY does not look like an OpenSSH private key." >&2
            exit 1
          fi

      - name: Normalize SSH target and port
        shell: bash
        run: |
          set -euo pipefail
          RAW_TARGET="${SG_SSH_TARGET}"
          DEPLOY_PORT="${SG_SSH_PORT:-18765}"

          # Supports either user@host or user@host:port.
          if [[ "$RAW_TARGET" =~ ^([^@[:space:]]+@[^:[:space:]]+):([0-9]+)$ ]]; then
            DEPLOY_TARGET="${BASH_REMATCH[1]}"
            if [ -z "${SG_SSH_PORT:-}" ]; then
              DEPLOY_PORT="${BASH_REMATCH[2]}"
            fi
          else
            DEPLOY_TARGET="${RAW_TARGET}"
          fi

          if [[ ! "$DEPLOY_TARGET" =~ ^[^@[:space:]]+@[^[:space:]]+$ ]]; then
            echo "Invalid SG_SSH_TARGET format. Expected user@host (or user@host:port)." >&2
            exit 1
          fi

          DEPLOY_HOST="${DEPLOY_TARGET#*@}"
          {
            echo "DEPLOY_TARGET=$DEPLOY_TARGET"
            echo "DEPLOY_HOST=$DEPLOY_HOST"
            echo "DEPLOY_PORT=$DEPLOY_PORT"
          } >> "$GITHUB_ENV"

      - name: Write SSH key file
        shell: bash
        run: |
          set -euo pipefail
          umask 177
          mkdir -p ~/.ssh
          printf '%s\n' "$SG_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/sg_deploy_key
          chmod 600 ~/.ssh/sg_deploy_key
          echo "Loaded deploy key fingerprint:"
          ssh-keygen -lf ~/.ssh/sg_deploy_key

      - name: Add host to known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH connectivity
        shell: bash
        run: |
          set -euo pipefail
          if ! ssh -p "$DEPLOY_PORT" -i ~/.ssh/sg_deploy_key -o BatchMode=yes -o IdentitiesOnly=yes "$DEPLOY_TARGET" "echo SSH_OK"; then
            echo "SSH connectivity failed. Retrying with verbose logging..." >&2
            ssh -vvv -p "$DEPLOY_PORT" -i ~/.ssh/sg_deploy_key -o BatchMode=yes -o IdentitiesOnly=yes "$DEPLOY_TARGET" "echo SSH_OK"
          fi

      - name: Build dist package
        shell: pwsh
        run: |
          ./scripts/build-dist.ps1

      - name: Deploy with rsync
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete --human-readable --itemize-changes \
            -e "ssh -p $DEPLOY_PORT -i ~/.ssh/sg_deploy_key -o IdentitiesOnly=yes" \
            ./dist/ \
            "${DEPLOY_TARGET}:${SG_REMOTE_PATH}/"
